<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSH POS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#111;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  background:#111;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.user-info{
  font-size:13px;
  color:#ccc;
}

/* NAVEGACIÓN */

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  background:white;
  padding:10px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:65px;
  z-index:40;
}

nav button{
  border:1px solid #ddd;
  background:white;
  border-radius:20px;
  padding:10px 15px;
  white-space:nowrap;
}

nav button.active{
  background:#111;
  color:white;
}

/* CONTENEDOR */

main{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.section{
  margin-bottom:20px;
}

.section-title{
  font-size:25px;
  font-weight:900;
  margin-bottom:15px;
}

/* TARJETAS */

.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
  border:1px solid #e5e5e5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

/* INPUTS */

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
}

.search-box{
  position:relative;
}

.search-box input{
  font-size:17px;
  padding:16px 16px 16px 45px;
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
}

/* CATEGORÍAS */

.category-scroll{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 14px;
  scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
  display:none;
}

.category-btn{
  flex:0 0 auto;
  border:1px solid #ddd;
  background:white;
  border-radius:25px;
  padding:11px 17px;
  font-weight:700;
}

.category-btn.active{
  background:#111;
  color:white;
  border-color:#111;
}

/* PRODUCTOS */

.category-heading{
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:18px 2px 10px;
  color:#555;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.product-card{
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  padding:15px;
  min-height:155px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:left;
}

.product-name{
  font-size:17px;
  font-weight:900;
  line-height:1.2;
}

.product-description{
  color:#777;
  font-size:12px;
  margin-top:6px;
  line-height:1.35;
}

.product-price{
  font-size:18px;
  font-weight:900;
  margin-top:10px;
}

.add-product{
  width:100%;
  border:0;
  background:#111;
  color:white;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  font-weight:800;
}

/* PEDIDO */

.order-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.order-item:last-child{
  border-bottom:0;
}

.qty-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  margin-top:7px;
}

.qty-controls button{
  border:1px solid #ddd;
  background:white;
  border-radius:9px;
  padding:6px 10px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
  font-size:24px;
  font-weight:900;
}

/* BOTONES */

.btn{
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  padding:12px 15px;
}

.btn-primary{
  background:#111;
  color:white;
  border-color:#111;
}

.btn-danger{
  background:#b91c1c;
  color:white;
  border-color:#b91c1c;
}

/* CARRITO FIJO */

.sticky-cart{
  position:fixed;
  bottom:12px;
  left:12px;
  right:12px;
  z-index:45;
  background:#111;
  color:white;
  border-radius:18px;
  padding:13px 15px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.sticky-cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sticky-cart button{
  background:white;
  color:#111;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:800;
}

/* MODALES */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:100;
}

.modal-content{
  background:white;
  width:min(850px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:22px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.close{
  border:0;
  background:#eee;
  border-radius:50%;
  width:40px;
  height:40px;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  background:white;
  width:min(430px,100%);
  padding:30px;
  border-radius:24px;
  border:1px solid #ddd;
}

.login-title{
  font-size:38px;
  font-weight:900;
  margin:0;
}

/* UTILIDADES */

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{
  justify-content:space-between;
}

.muted{
  color:#777;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#eee;
  font-size:12px;
}

@media(min-width:750px){
  .products-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:600px){
  main{
    padding:10px;
  }

  .products-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .product-card{
    min-height:145px;
    padding:13px;
  }

  .product-name{
    font-size:15px;
  }

  .product-price{
    font-size:16px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginView" class="login-screen">
  <div class="login-card">

    <h1 class="login-title">RUSH</h1>

    <p class="muted">
      Punto de venta · Rush Club Pádel
    </p>

    <div style="margin-top:20px">

      <label>
        Usuario
        <input
          id="loginUser"
          autocomplete="username"
          placeholder="Usuario">
      </label>

      <br>

      <label>
        Contraseña
        <input
          id="loginPass"
          type="password"
          autocomplete="current-password"
          placeholder="Contraseña">
      </label>

      <br>

      <button
        class="btn btn-primary"
        style="width:100%"
        onclick="login()">
        Iniciar sesión
      </button>

    </div>

  </div>
</div>


<!-- APP -->

<div id="appView" class="hidden">

<header>

  <div class="header-row">

    <div>
      <div class="logo">RUSH POS</div>

      <div
        id="userInfo"
        class="user-info">
      </div>
    </div>

    <button
      class="btn"
      onclick="logout()">
      Salir
    </button>

  </div>

</header>


<nav id="mainNav"></nav>


<main>

<!-- VENTA -->

<section
  id="ventaView"
  class="section">

  <div class="section-title">
    Nueva venta
  </div>


  <!-- MESA Y CLIENTE -->

  <div class="card">

    <div class="grid">

      <label>
        Mesa

        <select id="tableSelect">
          <option value="">
            Seleccionar mesa
          </option>
        </select>

      </label>


      <label>
        Cliente / grupo

        <input
          id="customerName"
          placeholder="Nombre o referencia">
      </label>

    </div>

  </div>


  <!-- BUSCADOR Y CATEGORÍAS -->

  <div class="card">

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="productSearch"
        type="search"
        placeholder="Buscar bebida, comida, café..."
        oninput="renderProducts()">

    </div>


    <div
      id="categoryTabs"
      class="category-scroll"
      style="margin-top:10px">
    </div>


    <div id="productsContainer">
    </div>

  </div>


  <!-- PEDIDO -->

  <div class="card">

    <div class="row between">

      <div>
        <strong>Pedido</strong>
      </div>

      <div
        id="waiterName"
        class="muted">
      </div>

    </div>


    <div
      id="cartContainer"
      style="margin-top:10px">
    </div>


    <div class="total-row">

      <span>Total</span>

      <span id="cartTotal">
        $0.00
      </span>

    </div>


    <label
      style="display:block;margin-top:12px">

      Notas

      <textarea
        id="orderNotes"
        rows="2"
        placeholder="Notas para cocina o servicio">
      </textarea>

    </label>


    <button
      class="btn btn-primary"
      style="width:100%;margin-top:12px"
      onclick="sendOrder()">

      Enviar a cocina

    </button>

  </div>

</section>


<!-- MESAS -->

<section
  id="mesasView"
  class="section hidden">

  <div class="section-title">
    Mesas
  </div>

  <div
    id="tablesContainer"
    class="grid">
  </div>

</section>


<!-- COCINA -->

<section
  id="cocinaView"
  class="section hidden">

  <div class="section-title">
    Cocina
  </div>

  <div
    id="kitchenContainer"
    class="grid">
  </div>

</section>


<!-- ORDENES -->

<section
  id="ordersView"
  class="section hidden">

  <div class="section-title">
    Órdenes
  </div>

  <div
    id="ordersContainer"
    class="grid">
  </div>

</section>


<!-- CAJA -->

<section
  id="cajaView"
  class="section hidden">

  <div class="section-title">
    Caja
  </div>

  <div
    id="cashierContainer">
  </div>

</section>


<!-- PRODUCTOS -->

<section
  id="productsAdminView"
  class="section hidden">

  <div class="section-title">
    Productos
  </div>

  <div class="card">

    <div class="grid">

      <input
        id="newProductName"
        placeholder="Nombre">

      <input
        id="newProductCategory"
        placeholder="Categoría">

      <input
        id="newProductPrice"
        type="number"

      <input
        id="newProductDescription"
        placeholder="Descripción">

    </div>

    <button

      Crear producto

    </button>

  </div>

  <div

  </div>

</section>


<!-- USUARIOS -->

<section
  id="usersView"
  class="section hidden">

  <div class="section-title">
    Usuarios
  </div>

  <div class="card">

    <div class="grid">

      <input
        id="newUserName"
        placeholder="Nombre">

      <input
        id="newUsername"
        placeholder="Usuario">

      <input
        id="newUserPassword"
        type="password"
        placeholder="Contraseña">

      <select id="newUserRole">

        <option value="waiter">
          Mesero
        </option>

        <option value="kitchen">
          Cocina
        </option>

        <option value="cashier">
          Caja
        </option>

        <option value="admin">
          Administrador
        </option>

      </select>

    </div>

    <button
      class="btn btn-primary"
      style="margin-top:12px"
      onclick="createUser()">

      Crear usuario

    </button>

  </div>

  <div id="usersContainer">
  </div>

</section>

</main>

</div>


<!-- CARRITO FIJO -->

<div
  id="stickyCart"
  class="sticky-cart hidden">

  <div class="sticky-cart-row">

    <div>

      <strong id="stickyCount">
        0 productos
      </strong>

      <br>

      <small id="stickyTotal">
        $0.00
      </small>

    </div>

    <button
      onclick="scrollToCart()">

      Ver pedido

    </button>

  </div>

</div>


<!-- MODAL PRODUCTO -->

<div
  id="productModal"
  class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">

      <div>

        <h2
          id="modalProductName"
          style="margin:0">
        </h2>

        <p
          id="modalProductDescription"
          class="muted">
        </p>

      </div>

      <button
        class="close"
        onclick="closeProductModal()">

        ×

      </button>

    </div>


    <div class="card">

      <label>

        Personalización / indicaciones

        <textarea
          id="modalProductNotes"
          rows="3"
          placeholder="Ej. sin azúcar, extra queso, sin cebolla...">
        </textarea>

      </label>


      <div
        class="row between"
        style="margin-top:15px">

        <strong
          id="modalProductPrice">
          $0.00
        </strong>

        <button
          class="btn btn-primary"
          onclick="confirmAddProduct()">

          Agregar al pedido

        </button>

      </div>

    </div>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="hidden"
  style="
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    z-index:200;
  ">
</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const API = "/api";

let token =
  localStorage.getItem("rush_token");

let currentUser = null;

let products = [];

let tables = [];

let cart = [];

let selectedCategory = "Todos";

let pendingProduct = null;


/* =========================================================
   UTILIDADES
========================================================= */

function $(id){
  return document.getElementById(id);
}


function money(value){

  return Number(value || 0).toLocaleString(
    "es-MX",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    });

}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(function(){

      el.classList.add("hidden");

    },3000);

}


/* =========================================================
   API
========================================================= */

async function api(path,options={}){

  options.headers = {
    ...(options.headers || {}),
    "Content-Type":"application/json"
  };

  if(token){

    options.headers.Authorization =
      "Bearer " + token;

  }

  const response =
    await fetch(API + path,options);

  const data =
    await response.json().catch(function(){
      return {};
    });

  if(response.status === 401){

    logout(false);

    throw new Error(
      data.error || "Sesión expirada"
    );

  }

  if(!response.ok){

    throw new Error(
      data.error || "Error en la operación"
    );

  }

  return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  try{

    const data =
      await api("/login",{
        method:"POST",

        body:JSON.stringify({

          username:
            $("loginUser").value.trim(),

          password:
            $("loginPass").value

        })

      });


    token = data.token;

    localStorage.setItem(
      "rush_token",
      token
    );

    currentUser =
      data.user;

    showApp();

    await loadAll();

  }catch(error){

    toast(error.message);

  }

}


async function boot(){

  if(!token){

    return;

  }

  try{

    const data =
      await api("/me");

    currentUser =
      data.user;

    showApp();

    await loadAll();

  }catch(error){

    localStorage.removeItem(
      "rush_token"
    );

    token = null;

  }

}


async function logout(showMessage=true){

  try{

    if(token){

      await api(
        "/logout",
        {method:"POST"}
      );

    }

  }catch(error){}

  token = null;

  currentUser = null;

  localStorage.removeItem(
    "rush_token"
  );

  $("appView")
    .classList
    .add("hidden");

  $("loginView")
    .classList
    .remove("hidden");

  if(showMessage){

    toast("Sesión cerrada");

  }

}


/* =========================================================
   ROLES
========================================================= */

function isAdmin(){

  return currentUser &&
    currentUser.role === "admin";

}


function isWaiter(){

  return currentUser &&
    (
      currentUser.role === "waiter" ||
      currentUser.role === "mesero"
    );

}


function isKitchen(){

  return currentUser &&
    (
      currentUser.role === "kitchen" ||
      currentUser.role === "cocina"
    );

}


function isCashier(){

  return currentUser &&
    currentUser.role === "cashier";

}


function roleName(role){

  if(role === "admin")
    return "Administrador";

  if(
    role === "waiter" ||
    role === "mesero"
  )
    return "Mesero";

  if(
    role === "kitchen" ||
    role === "cocina"
  )
    return "Cocina";

  if(role === "cashier")
    return "Caja";

  return role;

}


/* =========================================================
   APP / NAVEGACIÓN
========================================================= */

function showApp(){

  $("loginView")
    .classList
    .add("hidden");

  $("appView")
    .classList
    .remove("hidden");


  $("userInfo").textContent =
    currentUser.name +
    " · " +
    roleName(currentUser.role);


  $("waiterName").textContent =
    isWaiter() || isAdmin()
      ? "Atiende: " + currentUser.name
      : "";


  const nav = [];

  if(isAdmin() || isWaiter())
    nav.push(
      ["ventaView","🛒 Venta"]
    );

  if(isAdmin() || isWaiter())
    nav.push(
      ["mesasView","🪑 Mesas"]
    );

  if(isAdmin() || isKitchen())
    nav.push(
      ["cocinaView","👨‍🍳 Cocina"]
    );

  if(isAdmin() || isWaiter())
    nav.push(
      ["ordersView","📋 Órdenes"]
    );

  if(isAdmin() || isCashier())
    nav.push(
      ["cajaView","💰 Caja"]
    );

  if(isAdmin())
    nav.push(
      ["productsAdminView","📦 Productos"]
    );

  if(isAdmin())
    nav.push(
      ["usersView","👥 Usuarios"]
    );


  $("mainNav").innerHTML =
    nav.map(function(item,index){

      return `
        <button
          class="${index===0 ? "active" : ""}"
          onclick="showView('${item[0]}',this)">
          ${item[1]}
        </button>
      `;

    }).join("");


  if(nav.length){

    showView(
      nav[0][0],
      $("mainNav").firstElementChild
    );

  }

}


function showView(id,button){

  document
    .querySelectorAll("main > section")
    .forEach(function(section){

      section.classList.add("hidden");

    });


  $(id)
    .classList
    .remove("hidden");


  document
    .querySelectorAll("#mainNav button")
    .forEach(function(btn){

      btn.classList.remove("active");

    });


  if(button){

    button.classList.add("active");

  }


  if(id === "ventaView"){

    renderCategoryTabs();

    renderProducts();

    renderCart();

  }


  if(id === "mesasView")
    renderTables();


  if(id === "cocinaView")
    loadKitchen();


  if(id === "ordersView")
    loadOrders();


  if(id === "cajaView")
    loadCashier();


  if(id === "productsAdminView")
    renderAdminProducts();


  if(id === "usersView")
    loadUsers();

}


/* =========================================================
   CARGA GENERAL
========================================================= */

async function loadAll(){

  try{

    products =
      await api("/menu");

    tables =
      await api("/tables");


    renderCategoryTabs();

    renderProducts();

    renderTables();

    renderTableSelect();

    renderCart();

  }catch(error){

    toast(error.message);

  }

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function getProductCategory(product){

  const category =
    String(
      product.category || ""
    ).toLowerCase();

  const text =
    (
      product.name || ""
    ).toLowerCase()
    +
    " "
    +
    (
      product.description || ""
    ).toLowerCase()
    +
    " "
    +
    category;


  if(
    /café|cafe|espresso|latte|capuchino|cappuccino|americano|mocha|macchiato|frappé|frappe|té |te |refresco|agua|limonada|jugo|smoothie|bebida/.test(text)
  ){

    return "Bebidas";

  }


  if(
    /desayuno|huevo|huevos|omelette|chilaquil|hot cake|hotcake|waffle|mollete/.test(text)
  ){

    return "Desayunos";

  }


  if(
    /hamburguesa|hamburguesas|hamburger|burger/.test(text)
  ){

    return "Hamburguesas";

  }


  if(
    /ensalada|ensaladas|salad/.test(text)
  ){

    return "Ensaladas";

  }


  if(
    /postre|pastel|brownie|cheesecake|galleta|helado|dulce/.test(text)
  ){

    return "Postres";

  }


  if(
    /extra|adicional|complemento|papas|salsa/.test(text)
  ){

    return "Extras";

  }


  if(
    /sandwich|sándwich|panini|bagel|wrap|pizza|hot dog|hotdog|snack|comida|entrada/.test(text)
  ){

    return "Comida";

  }


  if(product.category){

    return product.category;

  }


  return "Otros";

}


function getCategories(){

  const categories = [];

  products.forEach(function(product){

    const category =
      getProductCategory(product);

    if(
      !categories.includes(category)
    ){

      categories.push(category);

    }

  });


  return [
    "Todos",
    ...categories
  ];

}


function categoryIcon(category){

  const icons = {

    "Todos":"✨",

    "Bebidas":"☕",

    "Desayunos":"🍳",

    "Comida":"🥪",

    "Hamburguesas":"🍔",

    "Ensaladas":"🥗",

    "Postres":"🍰",

    "Extras":"➕"

  };

  return icons[category] || "•";

}


function renderCategoryTabs(){

  const categories =
    getCategories();


  $("categoryTabs").innerHTML =
    categories.map(function(category){

      return `
        <button
          class="category-btn ${
            selectedCategory === category
              ? "active"
              : ""
          }"
          onclick="selectCategory('${escapeHTML(category)}')">

          ${categoryIcon(category)}
          ${escapeHTML(category)}

        </button>
      `;

    }).join("");

}


function selectCategory(category){

  selectedCategory =
    category;

  renderCategoryTabs();

  renderProducts();

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

  const search =
    (
      $("productSearch").value ||
      ""
    )
    .trim()
    .toLowerCase();


  const filtered =
    products.filter(function(product){

      const category =
        getProductCategory(product);


      const categoryMatch =
        selectedCategory === "Todos" ||
        category === selectedCategory;


      const searchText =
        (
          product.name || ""
        )
        +
        " "
        +
        (
          product.description || ""
        )
        +
        " "
        +
        (
          product.category || ""
        );


      const searchMatch =
        !search ||
        searchText
          .toLowerCase()
          .includes(search);


      return (
        categoryMatch &&
        searchMatch
      );

    });


  if(!filtered.length){

    $("productsContainer").innerHTML = `
      <div class="empty">
        No encontramos productos.
      </div>
    `;

    return;

  }


  const groups = {};


  filtered.forEach(function(product){

    const category =
      getProductCategory(product);

    if(!groups[category])
      groups[category] = [];

    groups[category].push(product);

  });


  let html = "";


  Object.keys(groups)
    .forEach(function(category){

      if(selectedCategory === "Todos"){

        html += `
          <div class="category-heading">
            ${categoryIcon(category)}
            ${escapeHTML(category)}
          </div>
        `;

      }


      html += `
        <div class="products-grid">
      `;


      groups[category]
        .forEach(function(product){

          html += `
            <button
              class="product-card"
              onclick="openProduct('${escapeHTML(product.id)}')">

              <div>

                <div class="product-name">
                  ${escapeHTML(product.name)}
                </div>

                <div class="product-description">
                  ${escapeHTML(
                    product.description || ""
                  )}
                </div>

              </div>

              <div>

                <div class="product-price">
                  $${money(product.price)}
                </div>

                <div class="add-product">
                  ＋ Agregar
                </div>

              </div>

            </button>
          `;

        });


      html += `
        </div>
      `;

    });


  $("productsContainer")
    .innerHTML = html;

}


/* =========================================================
   MODAL PRODUCTO
========================================================= */

function openProduct(id){

  const product =
    products.find(function(item){

      return String(item.id) ===
        String(id);

    });


  if(!product)
    return;


  pendingProduct =
    product;


  $("modalProductName")
    .textContent =
      product.name;


  $("modalProductDescription")
    .textContent =
      product.description || "";


  $("modalProductPrice")
    .textContent =
      "$" + money(product.price);


  $("modalProductNotes")
    .value = "";


  $("productModal")
    .classList
    .remove("hidden");

}


function closeProductModal(){

  pendingProduct =
    null;

  $("productModal")
    .classList
    .add("hidden");

}


function confirmAddProduct(){

  if(!pendingProduct)
    return;


  const notes =
    $("modalProductNotes")
      .value
      .trim();


  const existing =
    cart.find(function(item){

      return (
        String(item.menu_item_id) ===
          String(pendingProduct.id)
        &&
        item.notes === notes
      );

    });


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      menu_item_id:
        pendingProduct.id,

      name:
        pendingProduct.name,

      qty:1,

      unit_price:
        Number(
          pendingProduct.price
        ),

      modifiers:[],

      notes:notes

    });

  }


  closeProductModal();

  renderCart();

  toast(
    pendingProduct.name +
    " agregado al pedido"
  );

}


/* =========================================================
   CARRITO
========================================================= */

function renderCart(){

  const total =
    cart.reduce(function(sum,item){

      return sum +
        Number(item.qty) *
        Number(item.unit_price);

    },0);


  const count =
    cart.reduce(function(sum,item){

      return sum +
        Number(item.qty);

    },0);


  if(!cart.length){

    $("cartContainer").innerHTML = `
      <div class="empty">
        Agrega productos desde
        las categorías de arriba.
      </div>
    `;

  }else{

    $("cartContainer").innerHTML =
      cart.map(function(item,index){

        return `
          <div class="order-item">

            <div>

              <strong>
                ${item.qty} ×
                ${escapeHTML(item.name)}
              </strong>

              ${
                item.notes
                  ? `
                    <div
                      class="muted"
                      style="font-size:12px;margin-top:4px">

                      📝
                      ${escapeHTML(item.notes)}

                    </div>
                  `
                  : ""
              }

              <div
                class="muted"
                style="font-size:12px;margin-top:4px">

                $${money(item.unit_price)}
                c/u

              </div>

            </div>


            <div>

              <strong>
                $${money(
                  item.qty *
                  item.unit_price
                )}
              </strong>

              <div
                class="qty-controls">

                <button
                  onclick="changeQty(${index},-1)">
                  −
                </button>

                <span>
                  ${item.qty}
                </span>

                <button
                  onclick="changeQty(${index},1)">
                  ＋
                </button>

              </div>

            </div>

          </div>
        `;

      }).join("");

  }


  $("cartTotal")
    .textContent =
      "$" + money(total);


  if(count > 0){

    $("stickyCart")
      .classList
      .remove("hidden");

    $("stickyCount")
      .textContent =
        count +
        (
          count === 1
            ? " producto"
            : " productos"
        );

    $("stickyTotal")
      .textContent =
        "$" + money(total);

  }else{

    $("stickyCart")
      .classList
      .add("hidden");

  }

}


function changeQty(index,difference){

  if(!cart[index])
    return;


  cart[index].qty +=
    difference;


  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  renderCart();

}


function scrollToCart(){

  $("cartContainer")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================================================
   MESAS
========================================================= */

function renderTableSelect(){

  $("tableSelect").innerHTML =
    `
      <option value="">
        Seleccionar mesa
      </option>
    `
    +
    tables.map(function(table){

      return `
        <option
          value="${escapeHTML(table.id)}">

          ${escapeHTML(
            table.name ||
            ("Mesa " + table.number)
          )}

        </option>
      `;

    }).join("");

}


function renderTables(){

  $("tablesContainer").innerHTML =
    tables.map(function(table){

      return `
        <div class="card">

          <div
            class="row between">

            <strong>
              ${escapeHTML(
                table.name ||
                ("Mesa " + table.number)
              )}
            </strong>

            <span class="badge">
              ${escapeHTML(
                table.status || ""
              )}
            </span>

          </div>

          <p>
            Capacidad:
            ${table.capacity || "-"}
          </p>

          ${
            isAdmin() || isWaiter()
              ? `
                <button
                  class="btn"
                  onclick="setTable(
                    '${escapeHTML(table.id)}',
                    'available'
                  )">

                  Disponible

                </button>

                <button
                  class="btn"
                  onclick="setTable(
                    '${escapeHTML(table.id)}',
                    'reserved'
                  )">

                  Reservar

                </button>
              `
              : ""
          }

        </div>
      `;

    }).join("");

}


async function setTable(id,status){

  try{

    await api(
      "/tables/" + id,
      {
        method:"PATCH",

        body:JSON.stringify({
          status:status
        })

      }
    );


    tables =
      await api("/tables");

    renderTables();

    renderTableSelect();

  }catch(error){

    toast(error.message);

  }

}


/* =========================================================
   ENVIAR ORDEN
========================================================= */

async function sendOrder(){

  if(!cart.length){

    toast(
      "Agrega al menos un producto."
    );

    return;

  }


  try{

    await api(
      "/orders",
      {
        method:"POST",

        body:JSON.stringify({

          table_id:
            $("tableSelect").value ||
            null,

          customer_name:
            $("customerName").value,

          notes:
            $("orderNotes").value,

          items:
            cart

        })

      }
    );


    toast(
      "Orden enviada a cocina"
    );


    cart = [];

    renderCart();


    $("customerName").value = "";

    $("orderNotes").value = "";


    tables =
      await api("/tables");

    renderTableSelect();


  }catch(error){

    toast(error.message);

  }

}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

boot();

</script>
