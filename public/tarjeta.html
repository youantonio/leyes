<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2f26">
<title>Tarjeta de lealtad · The Rush</title>
<style>
:root{--ink:#0f2f26;--cream:#faf6ee;--gold:#f2a71b}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:linear-gradient(135deg,#0f2f26,#164a3b);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-weight:900;font-size:20px}
.brand small{display:block;font-weight:500;font-size:11px;color:#cfe3dc;letter-spacing:.5px}
.name{margin-top:18px;font-size:15px;color:#cfe3dc}
.stamps{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:20px}
.stamp.filled{background:var(--gold);border-color:var(--gold);color:#3a2600}
.progress{margin-top:14px;font-size:13px;color:#cfe3dc}
.reward{margin-top:16px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font-size:14px}
.reward b{color:var(--gold)}
.footer{margin-top:18px;font-size:11px;color:#a9c2b8;text-align:center}
.msg{max-width:380px;text-align:center;color:var(--ink)}
</style>
</head>
<body>
<div id="app" class="msg">Cargando tu tarjeta…</div>
<div id="refreshRow" style="text-align:center;margin-top:14px"></div>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('token');
async function loadCard(){
  if(!token){ document.getElementById('app').textContent='Link inválido. Pide tu tarjeta al mesero.'; return; }
  try{
    const r=await fetch('/api/loyalty-card?token='+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'No se encontró la tarjeta');
    const goal=d.goal, stamps=d.stamps;
    let dots=''; for(let i=1;i<=goal;i++) dots+=`<div class="stamp ${i<=stamps?'filled':''}">${i<=stamps?'🎾':''}</div>`;
    document.getElementById('app').outerHTML = `<div class="card">
      <div class="top"><div class="brand">🎾 THE RUSH<small>CLUB · CAFÉ · COCINA</small></div></div>
      <div class="name">Hola, ${d.name||'amig@'} 👋</div>
      <div class="stamps">${dots}</div>
      <div class="progress">${stamps} de ${goal} sellos${stamps>=goal?' · ¡completaste tu tarjeta! 🎉':''}</div>
      <div class="reward">🎁 Cada <b>${goal} visitas</b> ganas: <b>${d.reward||'una recompensa'}</b>${d.rewards_earned>d.rewards_redeemed?'<br><br>✅ Tienes una recompensa lista. ¡Muéstrale esta pantalla a tu mesero!':''}</div>
      <div class="footer">Un sello por cada cuenta pagada · The Rush</div>
    </div>`;
  }catch(e){
    document.getElementById('app').textContent = e.message || 'No se pudo cargar tu tarjeta.';
  }
}
loadCard();
document.getElementById('refreshRow').innerHTML = '<button onclick="loadCard()" style="background:none;border:1px solid #0f2f26;color:#0f2f26;padding:8px 16px;border-radius:10px;font-weight:700;cursor:pointer">↻ Actualizar</button><div style="font-size:11px;color:#8a7c62;margin-top:6px">Se actualiza sola cada compra</div>';
setInterval(loadCard, 15000);
</script>
</body>
</html>
</script>
</body>
</html>
